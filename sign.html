<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign the Guestbook - Reprobate Guitars</title>
  <link rel="canonical" href="https://reprobate-guitars.com/sign.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Reprobate Guitars">
  <meta property="og:title" content="Sign the Guestbook - Reprobate Guitars">
  <meta property="og:description" content="Reprobate Guitars: guitar repair, pro setups, and custom work. Vintage or modern, guitars, basses and all string instruments.">
  <meta property="og:url" content="https://reprobate-guitars.com/sign.html">
  <meta property="og:image" content="https://reprobate-guitars.com/images/share.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Reprobate Guitars: guitar repair, pro setups and custom work">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<div class="checker" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div class="stars" aria-hidden="true">&#9733; &#9733; &#9733;</div>
    <h1><a href="index.html" class="plain">Reprobate Guitars</a></h1>
    <p class="tagline">Sign our Guestbook!</p>
  </header>
  <nav aria-label="Main">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="sign.html">Sign</a>
    <a href="guestbook.html">View</a>
    <a href="index.html#quote">Get a Quote</a>
  </nav>
  <main>
    <p>Been by the shop? Got a guitar we fixed? Leave a note for the next cool cat. Please keep it friendly, and no links.</p>

    <form id="gb-form" novalidate>
      <label for="gb-name">Your name <span class="req">*</span></label>
      <input type="text" id="gb-name" name="name" required maxlength="40" autocomplete="nickname">

      <label for="gb-location">Where you're from (optional)</label>
      <input type="text" id="gb-location" name="location" maxlength="60" placeholder="e.g. Springfield, MO" autocomplete="off">

      <label for="gb-message">Your message <span class="req">*</span></label>
      <textarea id="gb-message" name="message" required maxlength="500" placeholder="Say hi!"></textarea>
      <p class="hint">500 characters max.</p>

      <div class="hp" aria-hidden="true">
        <label for="gb-website">Leave this empty</label>
        <input type="text" id="gb-website" name="website" tabindex="-1" autocomplete="off">
      </div>

      <button type="submit" id="gb-btn">Sign it!</button>
      <div id="gb-status" class="status" role="status" aria-live="polite"></div>
    </form>
    <p class="center"><a href="guestbook.html">View our Guestbook!</a></p>
  </main>
  <footer>
    <p><a href="index.html">&laquo; Back to the home page</a></p>
    <p class="small">&copy; Reprobate Guitars</p>
  </footer>
</div>
<div class="checker" aria-hidden="true"></div>
<script src="guestbook.js"></script>
</body>
</html>
